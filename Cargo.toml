[workspace]
resolver = "2"
members = [
    "_meta/rust-types",
    "shapez",
    "shapez-json",
    "shapez-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
