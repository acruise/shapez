[workspace]
resolver = "2"
members = [
    "shapez",
    "shapez-json",
    "shapez-gen",
    "shapez-jvm",
    "shapez-sniff",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"

[workspace.dependencies]
meta-types = { git = "https://github.com/acruise/_meta.git", rev = "dc3746c7b6e394b30fd8d603e84a5ff7867f523d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dateparser = "0.2"
